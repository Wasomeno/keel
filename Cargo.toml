[workspace]
resolver = "2"
members = [
    "apps/keel",
    "crates/doc",
    "crates/engine",
    "crates/harness",
    "crates/proto",
    "crates/rpc",
    "crates/store",
    "crates/theme",
    "crates/ui",
    "crates/update",
]

[workspace.package]
version = "0.3.0-beta.1"
edition = "2024"
publish = false

[workspace.dependencies]
keel-doc = { path = "crates/doc" }
keel-engine = { path = "crates/engine" }
keel-harness = { path = "crates/harness" }
keel-proto = { path = "crates/proto" }
keel-rpc = { path = "crates/rpc" }
keel-store = { path = "crates/store" }
keel-theme = { path = "crates/theme" }
keel-ui = { path = "crates/ui" }
keel-update = { path = "crates/update" }

keel-llm-types = { path = "../keel-harness/crates/keel-llm-types" }
keel-llm-protocol = { path = "../keel-harness/crates/keel-llm-protocol" }
keel-llm-route = { path = "../keel-harness/crates/keel-llm-route" }
keel-llm-catalog = { path = "../keel-harness/crates/keel-llm-catalog" }
keel-tools = { path = "../keel-harness/crates/keel-tools" }
keel-mcp = { path = "../keel-harness/crates/keel-mcp" }
keel-core = { path = "../keel-harness/crates/keel-core" }
keel-optmem = { path = "../keel-harness/crates/keel-optmem" }
keel-bot-harness = { path = "../keel-harness/crates/keel-bot-harness" }
tokio-util = { version = "0.7", features = ["rt"] }

async-trait = "0.1"

# gpui-fast is a retained-mode fork of upstream GPUI. Exact pins: 0.1.x is
# still experimental, and gpui-base 0.9.1 is the release built against this
# line. See docs/gpui-fast-migration.md.
gpui = { package = "gpui-fast", version = "=0.1.15" }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.15", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui-base = { version = "=0.9.1", features = ["gpui-fast"] }

clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
mimalloc = { version = "0.1", features = ["v2"] }
minisign-verify = "0.3"
notify = "7"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
loro = "1.13"
pulldown-cmark = "0.12"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
cef = { version = "156.2.0", default-features = false, features = ["build-util"] }
url = "2"

[profile.release]
# One codegen unit lets LLVM inline across the whole crate; thin LTO across
# crates. Slower to build, for the daily-driver binary.
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dev]
opt-level = 0
# Keel's own crates too: full DWARF made keel-ui alone a 220 MB rlib, and
# every test binary carried it. Backtraces still name file and line.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# Line tables keep backtraces readable; full DWARF for gpui/objc2 cost
# gigabytes of rlibs and object files and slowed every link.
debug = "line-tables-only"

# gpui-fast resolves zed-font-kit from crates.io (the zui fork resolved the
# zed-industries git source). The local patch is byte-identical to the crate
# source; keep it applied to preserve the pinned build input.
[patch.crates-io]
zed-font-kit = { path = "patches/font-kit" }

