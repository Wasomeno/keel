[package]
name = "keel-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
keel-doc.workspace = true
keel-harness.workspace = true
keel-proto.workspace = true
keel-rpc.workspace = true
keel-store.workspace = true
libc.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Terminal panel: one PTY per terminal, owned by the engine (DESIGN L5).
portable-pty = "0.8"
base64.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
# GitLab connection check (`GET /api/v4/user`).
ureq.workspace = true
# `show_diagram` checks the Mermaid source with the renderer the UI draws it with.
merman = { version = "0.9", default-features = false, features = ["all-diagrams", "svg"] }


[dev-dependencies]
async-trait.workspace = true
tracing-subscriber.workspace = true
